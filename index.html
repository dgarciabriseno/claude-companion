<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#a8d8ea">
    <title>Blobby - Virtual Pet</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <!-- Header with stats -->
        <header class="header">
            <h1 class="pet-name" id="petName">Blobby</h1>
            <div class="stats">
                <div class="stat">
                    <span class="stat-icon">❤️</span>
                    <div class="stat-bar">
                        <div class="stat-fill happiness-fill" id="happinessBar"></div>
                    </div>
                </div>
                <div class="stat">
                    <span class="stat-icon">🍎</span>
                    <div class="stat-bar">
                        <div class="stat-fill hunger-fill" id="hungerBar"></div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Pet Display Area -->
        <main class="pet-area" id="petArea">
            <div class="background-elements">
                <div class="cloud cloud-1"></div>
                <div class="cloud cloud-2"></div>
                <div class="cloud cloud-3"></div>
            </div>

            <div class="pet-container" id="petContainer">
                <!-- Pet SVG -->
                <svg class="pet" id="pet" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                    <!-- Pet Body -->
                    <ellipse class="pet-body" cx="100" cy="120" rx="70" ry="60" fill="#FFB6C1"/>

                    <!-- Blush -->
                    <ellipse class="blush left-blush" cx="55" cy="115" rx="12" ry="8" fill="#FF8FAB" opacity="0.6"/>
                    <ellipse class="blush right-blush" cx="145" cy="115" rx="12" ry="8" fill="#FF8FAB" opacity="0.6"/>

                    <!-- Eyes -->
                    <g class="eyes">
                        <ellipse class="eye left-eye" cx="75" cy="100" rx="12" ry="14" fill="#333"/>
                        <ellipse class="eye-shine" cx="79" cy="95" rx="4" ry="5" fill="#fff"/>
                        <ellipse class="eye right-eye" cx="125" cy="100" rx="12" ry="14" fill="#333"/>
                        <ellipse class="eye-shine" cx="129" cy="95" rx="4" ry="5" fill="#fff"/>
                    </g>

                    <!-- Happy Eyes (hidden by default) -->
                    <g class="happy-eyes" style="display: none;">
                        <path class="happy-eye" d="M 63 100 Q 75 88 87 100" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
                        <path class="happy-eye" d="M 113 100 Q 125 88 137 100" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
                    </g>

                    <!-- Mouth -->
                    <path class="mouth" d="M 85 130 Q 100 145 115 130" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>

                    <!-- Eating Mouth (hidden by default) -->
                    <ellipse class="eating-mouth" cx="100" cy="135" rx="10" ry="12" fill="#333" style="display: none;"/>

                    <!-- Ears -->
                    <ellipse class="ear left-ear" cx="45" cy="70" rx="15" ry="20" fill="#FFB6C1"/>
                    <ellipse class="ear-inner" cx="45" cy="70" rx="8" ry="12" fill="#FF8FAB"/>
                    <ellipse class="ear right-ear" cx="155" cy="70" rx="15" ry="20" fill="#FFB6C1"/>
                    <ellipse class="ear-inner" cx="155" cy="70" rx="8" ry="12" fill="#FF8FAB"/>

                    <!-- Arms -->
                    <ellipse class="arm left-arm" cx="35" cy="130" rx="12" ry="18" fill="#FFB6C1"/>
                    <ellipse class="arm right-arm" cx="165" cy="130" rx="12" ry="18" fill="#FFB6C1"/>

                    <!-- Feet -->
                    <ellipse class="foot left-foot" cx="70" cy="175" rx="18" ry="10" fill="#FFB6C1"/>
                    <ellipse class="foot right-foot" cx="130" cy="175" rx="18" ry="10" fill="#FFB6C1"/>

                    <!-- Accessories Container -->
                    <g class="accessories" id="accessories"></g>
                </svg>

                <!-- Floating elements for interactions -->
                <div class="floating-items" id="floatingItems"></div>

                <!-- Pet reaction bubble -->
                <div class="reaction-bubble" id="reactionBubble"></div>
            </div>

            <!-- Ground -->
            <div class="ground"></div>
        </main>

        <!-- Action Buttons -->
        <nav class="actions">
            <button class="action-btn feed-btn" id="feedBtn" aria-label="Feed pet">
                <span class="btn-icon">🍎</span>
                <span class="btn-label">Feed</span>
            </button>
            <button class="action-btn pet-btn" id="petBtn" aria-label="Pet">
                <span class="btn-icon">✋</span>
                <span class="btn-label">Pet</span>
            </button>
            <button class="action-btn dress-btn" id="dressBtn" aria-label="Dress up">
                <span class="btn-icon">👗</span>
                <span class="btn-label">Dress</span>
            </button>
        </nav>

        <!-- Dress Up Modal -->
        <div class="modal" id="dressModal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Dress Up</h2>
                    <button class="close-btn" id="closeModal" aria-label="Close">×</button>
                </div>
                <div class="wardrobe">
                    <div class="wardrobe-category">
                        <h3>Hats</h3>
                        <div class="items-grid" id="hatsGrid"></div>
                    </div>
                    <div class="wardrobe-category">
                        <h3>Accessories</h3>
                        <div class="items-grid" id="accessoriesGrid"></div>
                    </div>
                    <div class="wardrobe-category">
                        <h3>Colors</h3>
                        <div class="items-grid" id="colorsGrid"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
