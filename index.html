<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#a8d8ea">
  <title>Blobby - 3D Virtual Pet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div class="app" id="app">
    <!-- Header -->
    <header class="header">
      <div class="header-top">
        <h1 class="pet-name">Blobby</h1>
        <div class="coins-display">
          <span class="coin-icon">🪙</span>
          <span class="coin-amount" id="coinAmount">0</span>
        </div>
      </div>
      <div class="stats">
        <div class="stat">
          <span class="stat-icon">❤️</span>
          <div class="stat-bar">
            <div class="stat-fill happiness-fill" id="happinessBar"></div>
          </div>
        </div>
        <div class="stat">
          <span class="stat-icon">🍎</span>
          <div class="stat-bar">
            <div class="stat-fill hunger-fill" id="hungerBar"></div>
          </div>
        </div>
      </div>
    </header>

    <!-- 3D Canvas Area -->
    <main class="pet-area">
      <canvas id="petCanvas"></canvas>
      <div class="reaction-bubble" id="reactionBubble"></div>
    </main>

    <!-- Action Buttons -->
    <nav class="actions">
      <button class="action-btn feed-btn" id="feedBtn" data-testid="feed-btn">
        <span class="btn-icon">🍎</span>
        <span class="btn-label">Feed</span>
        <span class="btn-price">🪙 5</span>
      </button>
      <button class="action-btn pet-btn" id="petBtn" data-testid="pet-btn">
        <span class="btn-icon">✋</span>
        <span class="btn-label">Pet</span>
      </button>
      <button class="action-btn shop-btn" id="shopBtn" data-testid="shop-btn">
        <span class="btn-icon">👗</span>
        <span class="btn-label">Shop</span>
      </button>
      <button class="action-btn work-btn" id="workBtn" data-testid="work-btn">
        <span class="btn-icon">🎮</span>
        <span class="btn-label">Work</span>
      </button>
    </nav>

    <!-- Shop Modal -->
    <div class="modal" id="shopModal" data-testid="shop-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Shop</h2>
          <div class="modal-coins">🪙 <span id="shopCoins">0</span></div>
          <button class="close-btn" id="closeShop">×</button>
        </div>
        <div class="shop-content" id="shopContent"></div>
      </div>
    </div>

    <!-- Games Modal -->
    <div class="modal" id="gamesModal" data-testid="games-modal">
      <div class="modal-content games-modal-content">
        <div class="modal-header">
          <h2>Work for Coins</h2>
          <div class="modal-coins">🪙 <span id="gamesCoins">0</span></div>
          <button class="close-btn" id="closeGames">×</button>
        </div>
        <div class="games-content" id="gamesContent">
          <!-- Games List -->
          <div class="games-list" id="gamesList">
            <button class="game-select-btn" data-game="memory">
              <span class="game-icon">🧠</span>
              <div class="game-info">
                <span class="game-name">Memory Match</span>
                <span class="game-desc">Match pairs before time runs out</span>
              </div>
              <span class="game-reward">🪙 3-8</span>
            </button>
            <button class="game-select-btn" data-game="sequence">
              <span class="game-icon">🎵</span>
              <div class="game-info">
                <span class="game-name">Simon Says</span>
                <span class="game-desc">Remember the pattern sequence</span>
              </div>
              <span class="game-reward">🪙 4-12</span>
            </button>
            <button class="game-select-btn" data-game="reaction">
              <span class="game-icon">⚡</span>
              <div class="game-info">
                <span class="game-name">Quick Catch</span>
                <span class="game-desc">Catch falling treats</span>
              </div>
              <span class="game-reward">🪙 2-6</span>
            </button>
          </div>

          <!-- Game Areas -->
          <div class="game-area" id="memoryGameArea" style="display:none;">
            <div class="game-header">
              <span class="game-timer" id="memoryTimer">⏱️ 18s</span>
              <span class="game-score" id="memoryScore">Pairs: 0/6</span>
            </div>
            <div class="memory-grid" id="memoryGrid"></div>
          </div>

          <div class="game-area" id="sequenceGameArea" style="display:none;">
            <div class="game-header">
              <span class="game-level" id="sequenceLevel">Level: 1</span>
              <span class="game-status" id="sequenceStatus">Watch...</span>
            </div>
            <div class="sequence-grid" id="sequenceGrid">
              <button class="sequence-btn" data-index="0"></button>
              <button class="sequence-btn" data-index="1"></button>
              <button class="sequence-btn" data-index="2"></button>
              <button class="sequence-btn" data-index="3"></button>
            </div>
          </div>

          <div class="game-area" id="reactionGameArea" style="display:none;">
            <div class="game-header">
              <span class="game-timer" id="reactionTimer">⏱️ 12s</span>
              <span class="game-score" id="reactionScore">Caught: 0</span>
            </div>
            <div class="reaction-zone" id="reactionZone">
              <div class="catcher" id="catcher">🧺</div>
            </div>
          </div>

          <!-- Game Result -->
          <div class="game-result" id="gameResult" style="display:none;">
            <div class="result-icon" id="resultIcon">😢</div>
            <div class="result-text" id="resultText">You earned nothing...</div>
            <div class="result-coins" id="resultCoins"></div>
            <button class="play-again-btn" id="playAgainBtn">Try Again</button>
            <button class="back-btn" id="backToGamesBtn">Back to Jobs</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
      <span class="toast-icon" id="toastIcon">😰</span>
      <span class="toast-message" id="toastMessage"></span>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
